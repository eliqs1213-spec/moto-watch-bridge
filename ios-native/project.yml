name: MotoWatchNativeProbe
options:
  bundleIdPrefix: org.motowatchbridge
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  MotoWatchNativeProbe:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared/BatteryWidgetStore.swift
      - path: Resources/FindPhoneAlert.wav
        buildPhase: resources
    dependencies:
      - target: MotoBatteryWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.motowatchbridge.nativeprobe
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1'
        CODE_SIGN_STYLE: Manual
    entitlements:
      path: Config/App.entitlements
      properties:
        com.apple.security.application-groups:
          - group.org.motowatchbridge.shared
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: iWatch
        CFBundleShortVersionString: '0.5.0'
        CFBundleVersion: '5'
        NSBluetoothAlwaysUsageDescription: 'iWatch se conecta a Moto Watch Fit para controlar Spotify, consultar batería y localizar el teléfono.'
        CFBundleURLTypes:
          - CFBundleURLName: org.motowatchbridge.spotify-auth
            CFBundleURLSchemes:
              - motowatchbridgeeliqs
        UIBackgroundModes:
          - bluetooth-central
          - audio
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
  MotoBatteryWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: BatteryWidgets
      - path: Shared/BatteryWidgetStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.motowatchbridge.nativeprobe.widgets
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1'
        CODE_SIGN_STYLE: Manual
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    entitlements:
      path: Config/Widgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.org.motowatchbridge.shared
    info:
      path: BatteryWidgets/Info.plist
      properties:
        CFBundleDisplayName: iWatch Battery
        CFBundleShortVersionString: '0.5.0'
        CFBundleVersion: '5'
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
