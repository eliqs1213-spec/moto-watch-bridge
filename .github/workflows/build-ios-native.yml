name: Compilar Moto Watch Bridge iOS

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios-native/**'
      - '.github/workflows/build-ios-native.yml'

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Verificar protocolo de salud con datos sintéticos
        run: |
          cat ios-native/Sources/WatchHealthProtocol.swift ios-native/Sources/WatchHealthStore.swift ios-native/Sources/HealthHistoryPeriod.swift ios-native/Sources/WatchTrafficPolicy.swift ios-native/Tests/ProtocolChecks.swift ios-native/Tests/HealthStoreChecks.swift ios-native/Tests/PowerChecks.swift > "$RUNNER_TEMP/health-checks.swift"
          swift "$RUNNER_TEMP/health-checks.swift"

      - name: Validar estados reales de Feli durante el ayuno
        run: |
          cat ios-native/Sources/FeliFastingAnimationPolicy.swift ios-native/Tests/FeliFastingAnimationChecks.swift > "$RUNNER_TEMP/feli-fasting-checks.swift"
          swift "$RUNNER_TEMP/feli-fasting-checks.swift"

      - name: Validar continuidad musical ante pausas y 204
        run: |
          cat ios-native/Sources/SpotifyPlaybackContinuityPolicy.swift ios-native/Sources/SpotifyCommandQueuePolicy.swift ios-native/Tests/SpotifyContinuityChecks.swift > "$RUNNER_TEMP/spotify-continuity-checks.swift"
          swift "$RUNNER_TEMP/spotify-continuity-checks.swift"

      - name: Validar entradas MotoAccessoryBridgeKit sin escribir al reloj
        run: |
          cat ios-native/Sources/MotoAccessoryBridgeKit.swift ios-native/Tests/MotoAccessoryBridgeChecks.swift > "$RUNNER_TEMP/accessory-bridge-checks.swift"
          swift "$RUNNER_TEMP/accessory-bridge-checks.swift"

      - name: Diagnosticar capacidad HID y control multimedia BLE sin escribir al reloj
        run: |
          cat ios-native/Sources/WatchBLECapabilityProbe.swift ios-native/Tests/WatchBLECapabilityChecks.swift > "$RUNNER_TEMP/ble-capability-checks.swift"
          swift "$RUNNER_TEMP/ble-capability-checks.swift"

      - name: Validar clima iOS de seis días y veinticuatro horas
        run: |
          cat ios-native/Sources/WatchWeatherForecast.swift ios-native/Tests/WatchWeatherForecastChecks.swift > "$RUNNER_TEMP/weather-checks.swift"
          swift "$RUNNER_TEMP/weather-checks.swift"

      - name: Validar trama de clima Motorola antes de compilar iOS
        run: |
          cat ios-native/Sources/WatchProtocol.swift ios-native/Sources/WatchWeatherForecast.swift ios-native/Sources/WatchWeatherProtocol.swift ios-native/Tests/WatchWeatherProtocolChecks.swift > "$RUNNER_TEMP/weather-ble-checks.swift"
          swift "$RUNNER_TEMP/weather-ble-checks.swift"

      - name: Verificar señales 23/0A y 2A/05 sin escribir BLE
        run: |
          cat ios-native/Sources/WatchProtocol.swift ios-native/Sources/WatchEnvironmentalProtocol.swift ios-native/Tests/WatchEnvironmentalChecks.swift > "$RUNNER_TEMP/environment-checks.swift"
          swift "$RUNNER_TEMP/environment-checks.swift"

      - name: Verificar diagnóstico de Atajos sin datos obsoletos
        run: |
          cat ios-native/Sources/SpotifyShortcutSyncPolicy.swift ios-native/Tests/SpotifyShortcutSyncChecks.swift > "$RUNNER_TEMP/spotify-shortcuts-checks.swift"
          swift "$RUNNER_TEMP/spotify-shortcuts-checks.swift"

      - name: Validar árbitro mixto de metadatos Spotify
        run: |
          cat ios-native/Sources/SpotifyMetadataArbiter.swift ios-native/Tests/SpotifyMetadataArbiterChecks.swift > "$RUNNER_TEMP/spotify-arbiter-checks.swift"
          swift "$RUNNER_TEMP/spotify-arbiter-checks.swift"

      - name: Verificar reconexión segura Spotify iOS SDK
        run: |
          cat ios-native/Sources/SpotifySDKReconnectPolicy.swift ios-native/Tests/SpotifySDKReconnectChecks.swift > "$RUNNER_TEMP/spotify-sdk-reconnect-checks.swift"
          swift "$RUNNER_TEMP/spotify-sdk-reconnect-checks.swift"

      - name: Verificar tramas 24-01 de metadatos Motorola
        run: |
          cat ios-native/Sources/WatchProtocol.swift ios-native/Sources/WatchMusicProtocol.swift ios-native/Tests/MusicFrameChecks.swift > "$RUNNER_TEMP/music-frame-checks.swift"
          swift "$RUNNER_TEMP/music-frame-checks.swift"

      - name: Validar politica de Music Auto Sync
        run: |
          cat ios-native/Sources/MusicAutoSyncPolicy.swift ios-native/Tests/MusicAutoSyncChecks.swift > "$RUNNER_TEMP/music-auto-checks.swift"
          swift "$RUNNER_TEMP/music-auto-checks.swift"

      - name: Validar secuencias musicales y cierre de ESTADO
        run: |
          cat ios-native/Sources/WatchMusicSequencePolicy.swift ios-native/Tests/MusicSequenceChecks.swift > "$RUNNER_TEMP/music-sequence-checks.swift"
          swift "$RUNNER_TEMP/music-sequence-checks.swift"

      - name: Validar vigencia de metadatos Spotify SDK
        run: |
          cat ios-native/Sources/SpotifyNativeFreshnessPolicy.swift ios-native/Tests/SpotifyNativeFreshnessChecks.swift > "$RUNNER_TEMP/spotify-freshness-checks.swift"
          swift "$RUNNER_TEMP/spotify-freshness-checks.swift"

      - name: Verificar límites de experimento musical en segundo plano
        run: |
          cat ios-native/Sources/MusicBackgroundExperimentPolicy.swift ios-native/Tests/MusicBackgroundExperimentChecks.swift > "$RUNNER_TEMP/music-bg-experiment-checks.swift"
          swift "$RUNNER_TEMP/music-bg-experiment-checks.swift"

      - name: Validar respuestas Web API reales contra SDK reciente y suspensión
        run: |
          cat ios-native/Sources/SpotifyBackgroundProbePolicy.swift ios-native/Tests/SpotifyBackgroundProbeChecks.swift > "$RUNNER_TEMP/spotify-bg-http-checks.swift"
          swift "$RUNNER_TEMP/spotify-bg-http-checks.swift"
          grep -F 'let playback = try await fetchPlayback()' ios-native/Sources/SpotifyBridge.swift
          grep -F 'probeWebPlaybackWhileBackgrounded()' ios-native/Sources/MusicBackgroundExperiment.swift

      - name: Configurar Xcode y generar proyecto
        run: |
          xcodebuild -version
          brew install xcodegen
          cd ios-native
          xcodegen generate

      - name: Compilar para iPhone físico (sin firmar)
        run: |
          xcodebuild \
            -project ios-native/MotoWatchNativeProbe.xcodeproj \
            -scheme MotoWatchNativeProbe \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Empaquetar IPA sin firmar
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/MotoWatchNativeProbe.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/MotoWatchNativeProbe-unsigned.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/MotoWatchNativeProbe-unsigned.ipa"

      - name: Crear IPA con firmas ad-hoc verificadas de app y extensión
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/MotoWatchNativeProbe.app"
          bash ios-native/scripts/prepare-sideload-ipa.sh "$APP" "$GITHUB_WORKSPACE/MotoWatchNativeProbe-sideload-prepared.ipa"
          unzip -Z1 "$GITHUB_WORKSPACE/MotoWatchNativeProbe-sideload-prepared.ipa" | grep -F 'Payload/MotoWatchNativeProbe.app/PlugIns/MotoBatteryWidgets.appex/MotoBatteryWidgets'
          ls -lh "$GITHUB_WORKSPACE/MotoWatchNativeProbe-sideload-prepared.ipa"

      - name: Comprobar firma AD-HOC tras empaquetado (antes de Sideloadly)
        run: |
          set -euo pipefail
          TEMP_DIR="$RUNNER_TEMP/verify-sideload"
          mkdir -p "$TEMP_DIR"
          unzip -q "$GITHUB_WORKSPACE/MotoWatchNativeProbe-sideload-prepared.ipa" -d "$TEMP_DIR"
          APP="$TEMP_DIR/Payload/MotoWatchNativeProbe.app"
          EXT="$APP/PlugIns/MotoBatteryWidgets.appex"
          test -x "$EXT/MotoBatteryWidgets"
          /usr/bin/codesign --verify --strict --verbose=2 "$EXT"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP"
          test "$(/usr/bin/plutil -extract NSSupportsLiveActivities raw -o - "$APP/Info.plist")" = "true"
          test "$(/usr/bin/plutil -extract NSExtension.NSExtensionPointIdentifier raw -o - "$EXT/Info.plist")" = "com.apple.widgetkit-extension"
          echo "APP y WidgetKit íntegros al salir de CI. Sideloadly debe re-firmar AMBOS con el mismo equipo."
      - name: Publicar IPA preparado para ser re-firmado con Sideloadly
        uses: actions/upload-artifact@v4
        with:
          name: MotoWatchNativeProbe-sideload-prepared
          path: MotoWatchNativeProbe-sideload-prepared.ipa
          retention-days: 14

      - name: Verificar extensión WidgetKit empaquetada dentro del IPA
        run: |
          set -euo pipefail
          IPA="$GITHUB_WORKSPACE/MotoWatchNativeProbe-unsigned.ipa"
          unzip -Z1 "$IPA" | grep -F 'Payload/MotoWatchNativeProbe.app/PlugIns/MotoBatteryWidgets.appex/MotoBatteryWidgets'
          unzip -Z1 "$IPA" | grep -F 'Payload/MotoWatchNativeProbe.app/PlugIns/MotoBatteryWidgets.appex/Info.plist'
          unzip -p "$IPA" 'Payload/MotoWatchNativeProbe.app/PlugIns/MotoBatteryWidgets.appex/Info.plist' | plutil -p - | grep -F 'com.apple.widgetkit-extension'
          echo 'EXTENSION PRESENTE EN IPA SIN FIRMAR: registro en iOS depende del proceso Sideloadly'

      - name: Publicar IPA para descargar
        uses: actions/upload-artifact@v4
        with:
          name: MotoWatchNativeProbe-unsigned
          path: MotoWatchNativeProbe-unsigned.ipa
          retention-days: 14
