name: MotoWatchFirmwareLab
options:
  bundleIdPrefix: org.motowatchbridge
  deploymentTarget:
    iOS: '16.2'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  MotoWatchFirmwareLab:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.motowatchbridge.firmwarelab
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1'
        CODE_SIGN_STYLE: Manual
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Moto Firmware Lab
        CFBundleShortVersionString: '0.1.1'
        CFBundleVersion: '2'
        NSBluetoothAlwaysUsageDescription: 'Moto Firmware Lab explora servicios Bluetooth y consulta información estándar del reloj. No escribe firmware ni envía comandos OTA.'
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
